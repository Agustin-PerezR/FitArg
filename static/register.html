<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - FitArg</title>
  <meta name="description" content="Creá tu cuenta en FitArg para gestionar tus rutinas de entrenamiento.">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/" class="brand">
        <span>🏋️ FitArg</span>
        <span class="brand-sun">☀️</span>
        <span class="brand-badge">ARG</span>
      </a>
      <div class="flex items-center gap-4">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Cambiar modo de color">
          <span id="theme-icon">🌙</span>
          <span id="theme-text">Modo Oscuro</span>
        </button>
        <a href="/login.html" class="btn btn-outline">Iniciar Sesión</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor del Formulario de Registro -->
  <main class="container flex justify-center items-center" style="min-height: calc(100vh - 160px); padding: var(--spacing-8) var(--spacing-4);">
    <div class="card" style="width: 100%; max-width: 480px;">
      <div class="card-header" style="text-align: center;">
        <span class="brand-badge" style="margin-bottom: var(--spacing-2);">NUEVA CUENTA</span>
        <h2>Crear Cuenta en FitArg</h2>
        <p>Comenzá a registrar tus progresos y rutinas</p>
      </div>

      <div id="alert-box" style="display: none;" class="alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Nombre completo</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Ej. Franco Armani" required minlength="2">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="nombre@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres (letras y números)" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
          <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="Repetí tu contraseña" required>
        </div>

        <button type="submit" id="btn-submit-register" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-4); padding: var(--spacing-3);">
          Registrarme en FitArg
        </button>
      </form>

      <div style="margin-top: var(--spacing-6); text-align: center; font-size: var(--font-size-sm); color: var(--text-muted);">
        ¿Ya tenés una cuenta? <a href="/login.html" style="font-weight: 600;">Iniciá sesión acá</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('btn-submit-register');

    function showAlert(type, message) {
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!name || name.length < 2) {
        return showAlert('danger', 'Por favor ingresá tu nombre (mínimo 2 caracteres).');
      }
      if (!email || !email.includes('@')) {
        return showAlert('danger', 'Por favor ingresá un correo electrónico válido.');
      }
      if (password.length < 6) {
        return showAlert('danger', 'La contraseña debe tener al menos 6 caracteres.');
      }
      if (password !== confirmPassword) {
        return showAlert('danger', 'Las contraseñas no coinciden.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registrando...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('success', '¡Cuenta creada con éxito! Redirigiendo al inicio de sesión...');
          form.reset();
          setTimeout(() => {
            window.location.href = '/login.html?registered=true';
          }, 1500);
        } else {
          const errorMsg = (data.errors && data.errors.join(' ')) || data.error || 'Error al procesar el registro.';
          showAlert('danger', errorMsg);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Registrarme en FitArg';
        }
      } catch (err) {
        showAlert('danger', 'Error de conexión con el servidor. Intente nuevamente.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Registrarme en FitArg';
      }
    });
  </script>
</body>
</html>
