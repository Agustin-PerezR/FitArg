<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - FitArg</title>
  <meta name="description" content="Solicitá el enlace de recuperación de contraseña de tu cuenta en FitArg.">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/" class="brand">
        <span>🏋️ FitArg</span>
        <span class="brand-sun">☀️</span>
        <span class="brand-badge">ARG</span>
      </a>
      <div class="flex items-center gap-4">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Cambiar modo de color">
          <span id="theme-icon">🌙</span>
          <span id="theme-text">Modo Oscuro</span>
        </button>
        <a href="/login.html" class="btn btn-outline">Volver a Ingresar</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor Recuperar Contraseña -->
  <main class="container flex justify-center items-center" style="min-height: calc(100vh - 160px); padding: var(--spacing-8) var(--spacing-4);">
    <div class="card" style="width: 100%; max-width: 440px;">
      <div class="card-header" style="text-align: center;">
        <span class="brand-badge" style="margin-bottom: var(--spacing-2);">SEGURIDAD</span>
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Ingresá tu correo y te enviaremos un enlace seguro para restablecerla.</p>
      </div>

      <div id="alert-box" style="display: none;" class="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico registrado</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="nombre@ejemplo.com" required>
        </div>

        <button type="submit" id="btn-submit-forgot" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-4); padding: var(--spacing-3);">
          Enviar Enlace de Recuperación
        </button>
      </form>

      <div style="margin-top: var(--spacing-6); text-align: center; font-size: var(--font-size-sm); color: var(--text-muted);">
        ¿Recordaste tu contraseña? <a href="/login.html" style="font-weight: 600;">Iniciar sesión</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('btn-submit-forgot');

    function showAlert(type, message) {
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) {
        return showAlert('danger', 'Por favor ingresá un correo electrónico válido.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando enlace...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showAlert('success', '¡Enlace enviado! Revisá tu bandeja de entrada para continuar con el restablecimiento.');
          form.reset();
        } else {
          showAlert('danger', data.error || 'No se pudo procesar la solicitud.');
        }
      } catch (err) {
        showAlert('danger', 'Error de conexión con el servidor.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar Enlace de Recuperación';
      }
    });
  </script>
</body>
</html>
