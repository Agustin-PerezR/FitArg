<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dar de Baja Cuenta - FitArg</title>
  <meta name="description" content="Dar de baja tu cuenta en FitArg de forma segura.">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/" class="brand">
        <span>🏋️ FitArg</span>
        <span class="brand-sun">☀️</span>
        <span class="brand-badge">ARG</span>
      </a>
      <div class="flex items-center gap-4">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Cambiar modo de color">
          <span id="theme-icon">🌙</span>
          <span id="theme-text">Modo Oscuro</span>
        </button>
        <a href="/profile.html" class="btn btn-outline">Volver a Mi Perfil</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor de Baja Lógica -->
  <main class="container flex justify-center items-center" style="min-height: calc(100vh - 160px); padding: var(--spacing-8) var(--spacing-4);">
    <div class="card" style="width: 100%; max-width: 500px; border-color: var(--color-danger);">
      <div class="card-header" style="text-align: center;">
        <span class="badge" style="background-color: var(--color-danger-bg); color: var(--color-danger); margin-bottom: var(--spacing-2);">
          ZONA DE SEGURIDAD
        </span>
        <h2 style="color: var(--color-danger);">Dar de baja mi cuenta</h2>
        <p>Esta acción desactivará tu cuenta y acceso a las rutinas de FitArg.</p>
      </div>

      <div id="alert-box" style="display: none;" class="alert"></div>

      <div class="alert alert-danger" style="margin-bottom: var(--spacing-4);">
        ⚠️ <strong>Atención:</strong> Al confirmar, tu usuario quedará inactivo inmediatamente y no podrás volver a iniciar sesión sin asistencia técnica.
      </div>

      <form id="delete-account-form">
        <div class="form-group">
          <label for="confirm-password" class="form-label">Ingresá tu contraseña para confirmar:</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Tu contraseña" required>
        </div>

        <div class="flex justify-between items-center" style="margin-top: var(--spacing-6);">
          <a href="/profile.html" class="btn btn-outline">Cancelar</a>
          <button type="submit" id="btn-confirm-delete" class="btn btn-danger">
            Confirmar Baja de Cuenta
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    const userJson = localStorage.getItem('fitarg_user');
    if (!userJson) {
      window.location.href = '/login.html';
    }
    const currentUser = JSON.parse(userJson || '{}');
    const form = document.getElementById('delete-account-form');
    const alertBox = document.getElementById('alert-box');
    const deleteBtn = document.getElementById('btn-confirm-delete');

    function showAlert(type, message) {
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const password = document.getElementById('confirm-password').value;
      if (!password) {
        return showAlert('danger', 'Por favor ingresá tu contraseña.');
      }

      deleteBtn.disabled = true;
      deleteBtn.textContent = 'Procesando baja...';

      try {
        const res = await fetch('/api/profile/deactivate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: currentUser.id,
            password: password
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showAlert('success', 'Tu cuenta ha sido dada de baja. Cerrando sesión...');
          localStorage.removeItem('fitarg_user');
          localStorage.removeItem('fitarg_token');
          setTimeout(() => {
            window.location.href = '/index.html?deactivated=true';
          }, 2000);
        } else {
          showAlert('danger', data.error || 'No se pudo dar de baja la cuenta.');
          deleteBtn.disabled = false;
          deleteBtn.textContent = 'Confirmar Baja de Cuenta';
        }
      } catch (err) {
        showAlert('danger', 'Error de conexión con el servidor.');
        deleteBtn.disabled = false;
        deleteBtn.textContent = 'Confirmar Baja de Cuenta';
      }
    });
  </script>
</body>
</html>
