<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - FitArg</title>
  <meta name="description" content="Ingresá tu nueva contraseña para volver a acceder a FitArg.">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/" class="brand">
        <span>🏋️ FitArg</span>
        <span class="brand-sun">☀️</span>
        <span class="brand-badge">ARG</span>
      </a>
      <div class="flex items-center gap-4">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Cambiar modo de color">
          <span id="theme-icon">🌙</span>
          <span id="theme-text">Modo Oscuro</span>
        </button>
        <a href="/login.html" class="btn btn-outline">Iniciar Sesión</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor Restablecer Contraseña -->
  <main class="container flex justify-center items-center" style="min-height: calc(100vh - 160px); padding: var(--spacing-8) var(--spacing-4);">
    <div class="card" style="width: 100%; max-width: 440px;">
      <div class="card-header" style="text-align: center;">
        <span class="brand-badge" style="margin-bottom: var(--spacing-2);">NUEVA CLAVE</span>
        <h2>Crear Nueva Contraseña</h2>
        <p>Elegí una contraseña segura para tu cuenta</p>
      </div>

      <div id="alert-box" style="display: none;" class="alert"></div>

      <div id="token-invalid-container" style="display: none; text-align: center;">
        <p style="margin-bottom: var(--spacing-4);">El enlace de recuperación no es válido o ha expirado.</p>
        <a href="/forgot-password.html" class="btn btn-primary">Solicitar Nuevo Enlace</a>
      </div>

      <form id="reset-form" style="display: none;" novalidate>
        <div class="form-group">
          <label for="new-password" class="form-label">Nueva contraseña</label>
          <input type="password" id="new-password" class="form-control" placeholder="Mínimo 6 caracteres (letras y números)" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirmar nueva contraseña</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Repetí tu nueva contraseña" required>
        </div>

        <button type="submit" id="btn-submit-reset" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-4); padding: var(--spacing-3);">
          Guardar Nueva Contraseña
        </button>
      </form>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const alertBox = document.getElementById('alert-box');
    const resetForm = document.getElementById('reset-form');
    const invalidContainer = document.getElementById('token-invalid-container');
    const submitBtn = document.getElementById('btn-submit-reset');

    function showAlert(type, message) {
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    async function checkToken() {
      if (!token) {
        showAlert('danger', 'No se proporcionó ningún token de recuperación.');
        invalidContainer.style.display = 'block';
        return;
      }

      try {
        const res = await fetch(`/api/auth/validate-reset-token?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (res.ok && data.valid) {
          resetForm.style.display = 'block';
        } else {
          showAlert('danger', data.error || 'El enlace de recuperación es inválido o ha expirado.');
          invalidContainer.style.display = 'block';
        }
      } catch (err) {
        showAlert('danger', 'Error de conexión con el servidor.');
        invalidContainer.style.display = 'block';
      }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!newPassword || newPassword.length < 6) {
        return showAlert('danger', 'La contraseña debe tener al menos 6 caracteres.');
      }
      if (newPassword !== confirmPassword) {
        return showAlert('danger', 'Las contraseñas no coinciden.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Actualizando contraseña...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            new_password: newPassword
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showAlert('success', '¡Contraseña actualizada exitosamente! Redirigiendo al inicio de sesión...');
          resetForm.reset();
          setTimeout(() => {
            window.location.href = '/login.html?reset=true';
          }, 2000);
        } else {
          showAlert('danger', data.error || 'No se pudo restablecer la contraseña.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Guardar Nueva Contraseña';
        }
      } catch (err) {
        showAlert('danger', 'Error al comunicarse con el servidor.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar Nueva Contraseña';
      }
    });

    checkToken();
  </script>
</body>
</html>
